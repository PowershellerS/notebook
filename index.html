<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#37352f;--mut:#9b9a97;--side:#f7f7f5;--line:#e9e9e7;--hover:rgba(55,53,47,.08);--accent:#2383e2;--card:#fff;--code:#f1f1ef;--callout:#f1f1ef;--shadow:0 8px 30px rgba(0,0,0,.14)}
[data-theme=dark]{--bg:#191919;--fg:#e6e6e4;--mut:#8b8b88;--side:#202020;--line:#2f2f2f;--hover:rgba(255,255,255,.08);--accent:#4aa3ff;--card:#252525;--code:#2a2a2a;--callout:#2a2a2a;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;overflow:hidden}
#side .brand{padding:14px 14px 8px;font-weight:600;display:flex;gap:8px;align-items:center}
#side .sc{flex:1;overflow:auto;padding:0 6px 10px}
#side .sec{font-size:11px;font-weight:600;color:var(--mut);padding:12px 8px 4px;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;cursor:pointer;min-height:28px;color:var(--fg);width:100%;text-align:left}
.nav:hover{background:var(--hover)}.nav.act{background:var(--hover);font-weight:500}
.nav .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .car{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--mut);font-size:10px;flex:none}
.nav .car:hover{background:var(--hover)}
.nav .add{opacity:0;width:20px;height:20px;border-radius:4px;color:var(--mut);display:grid;place-items:center}
.nav:hover .add{opacity:1}.nav .add:hover{background:var(--hover)}
.nav .kbd{font-size:11px;color:var(--mut)}
#side .foot{border-top:1px solid var(--line);padding:6px}
#side .foot small{display:block;color:var(--mut);font-size:11px;padding:4px 8px}
#main{height:100vh;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.top{height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;flex:none;font-size:13px;color:var(--mut)}
.top .bc{flex:1;display:flex;gap:4px;align-items:center;overflow:hidden;white-space:nowrap}
.top .bc a{cursor:pointer;padding:2px 6px;border-radius:5px;color:var(--fg)}.top .bc a:hover{background:var(--hover)}
.btn{padding:4px 10px;border-radius:6px;font-size:13px;color:var(--fg)}.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.bd{border:1px solid var(--line)}
#burger{display:none}
.scroll{flex:1;overflow:auto}
.cover{height:190px;position:relative}
.inner{max-width:860px;margin:0 auto;padding:0 56px 160px}
.inner.wide{max-width:1200px}
.icon{font-size:68px;line-height:1;margin-top:-34px;position:relative;cursor:pointer;width:max-content;border-radius:8px;padding:2px}
.icon:hover{background:var(--hover)}
.hbtns{display:flex;gap:4px;margin:14px 0 4px;opacity:.0;transition:.15s}
.inner:hover .hbtns{opacity:1}.hbtns .btn{color:var(--mut)}
.title{font-size:40px;font-weight:700;line-height:1.2;outline:none;margin:8px 0 14px;word-break:break-word}
.title:empty:before,.ed:focus:empty:before,.ed.first:empty:before{content:attr(data-ph);color:var(--mut);opacity:.55;pointer-events:none}
.blk{display:flex;align-items:flex-start;gap:2px;position:relative;margin-left:-26px;padding-left:26px}
.blk .grip{position:absolute;left:0;top:3px;opacity:0;cursor:grab;color:var(--mut);font-size:13px;user-select:none;width:22px;text-align:center;letter-spacing:-3px}
.blk:hover .grip{opacity:1}
.blk .ed{flex:1;min-width:0;outline:none;padding:3px 2px;white-space:pre-wrap;word-break:break-word}
.blk .mk{flex:none;min-width:24px;padding:3px 0;text-align:center;color:var(--fg)}
.blk .mk:empty{display:none}
.blk.t-h1 .ed{font-size:30px;font-weight:700;line-height:1.25;margin-top:20px}
.blk.t-h2 .ed{font-size:24px;font-weight:600;line-height:1.3;margin-top:14px}
.blk.t-h3 .ed{font-size:19px;font-weight:600;margin-top:8px}
.blk.t-quote .ed{border-left:3px solid var(--fg);padding-left:14px;margin-left:2px}
.blk.t-callout{background:var(--callout);border-radius:6px;padding:10px 12px 10px 38px;margin:4px 0}
.blk.t-callout .mk{padding-top:3px}
.blk.t-code .ed{font-family:'JetBrains Mono',monospace;font-size:13.5px;background:var(--code);border-radius:6px;padding:12px 14px;margin:3px 0}
.blk.done .ed{text-decoration:line-through;color:var(--mut)}
.blk hr{flex:1;border:0;border-top:1px solid var(--line);margin:12px 0}
.blk.dropbefore:before,.blk.dropafter:after{content:'';position:absolute;left:26px;right:0;height:3px;background:var(--accent);border-radius:2px}
.blk.dropbefore:before{top:-2px}.blk.dropafter:after{bottom:-2px}
.ed a.plink{color:var(--fg);text-decoration:underline;text-decoration-color:var(--mut);cursor:pointer;font-weight:500}
.ed a.plink.broken{color:var(--mut);text-decoration:line-through}
.ed code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.88em;color:#eb5757}
.ed a[href]{color:var(--accent)}
.addblk{height:120px;cursor:text}
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;width:260px;max-height:320px;overflow:auto}
.menu .it{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:5px;cursor:pointer}
.menu .it.sel,.menu .it:hover{background:var(--hover)}
.menu .it b{width:28px;height:28px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;font-weight:500;font-size:12px;flex:none;background:var(--bg)}
.menu .it small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.menu .hd{font-size:11px;color:var(--mut);padding:4px 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
.dlg{background:var(--card);border-radius:10px;box-shadow:var(--shadow);width:min(560px,92vw);max-height:78vh;overflow:auto;padding:18px}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;outline:none}
.dlg input:focus,.dlg textarea:focus{border-color:var(--accent)}
.dlg textarea{min-height:200px;font-family:'JetBrains Mono',monospace;font-size:12px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.emoji{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.emoji button{font-size:24px;padding:4px;border-radius:6px}.emoji button:hover{background:var(--hover)}
.covers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.covers button{height:56px;border-radius:6px;border:1px solid var(--line)}
.res{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer}
.res.sel,.res:hover{background:var(--hover)}.res small{color:var(--mut);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.chip{display:inline-block;padding:0 8px;border-radius:4px;font-size:13px;line-height:20px;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:13px;outline:none}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:4px 12px;font-size:13px}.seg button.on{background:var(--hover);font-weight:600}
table.db{border-collapse:collapse;width:100%;font-size:14px}
table.db th{font-weight:500;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);white-space:nowrap;font-size:13px}
table.db td{padding:2px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.db tr:hover td{background:var(--hover)}
.cell{border:0;background:transparent;outline:none;width:100%;padding:5px 4px;border-radius:4px;min-width:90px}
.cell:focus{box-shadow:0 0 0 2px var(--accent) inset}
select.cell{cursor:pointer}
.tcell{display:flex;align-items:center;gap:4px}.tcell .open{opacity:0;color:var(--mut);padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid var(--line)}
tr:hover .tcell .open{opacity:1}
.board{display:flex;gap:12px;align-items:flex-start;overflow:auto;padding-bottom:20px}
.col{flex:0 0 260px;background:var(--side);border-radius:8px;padding:8px;min-height:80px}
.col.over{outline:2px dashed var(--accent)}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mut)}
.lrow{display:flex;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}.lrow:hover{background:var(--hover)}
.props{display:grid;grid-template-columns:140px 1fr;gap:2px 8px;margin-bottom:18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
.props .pl{color:var(--mut);font-size:14px}
.lbl{font-size:13px;font-weight:600;color:var(--mut);margin:34px 0 6px}
.bl{display:flex;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;align-items:center}.bl:hover{background:var(--hover)}
.hero h1{font-size:34px;margin:50px 0 6px}.hero p{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-height:90px}.tile:hover{background:var(--hover)}.tile .i{font-size:26px}
.banner{background:#fbe4e4;color:#5d1715;padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
[data-theme=dark] .banner{background:#4a2423;color:#ffd9d9}
@media(max-width:760px){body{grid-template-columns:1fr}#side{position:fixed;z-index:40;left:0;top:0;width:270px;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow)}body.sb #side{transform:none}#burger{display:inline-block}.inner{padding:0 20px 120px}.title{font-size:30px}.props{grid-template-columns:1fr}}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;z-index:90;font-size:14px;box-shadow:var(--shadow)}
.vtabs{display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--line);margin:6px 0 8px;flex-wrap:wrap}
.vt{padding:5px 10px;font-size:13.5px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.vt.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{padding:4px 8px;font-size:12px;color:var(--mut);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .day{min-height:92px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;min-width:0}
.cal .day.off{background:var(--side)}.cal .day.today .n{background:#eb5757;color:#fff;border-radius:50%;padding:0 6px}
.cal .ev{background:var(--hover);border-radius:4px;padding:1px 6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card)}.gcard:hover{box-shadow:var(--shadow)}
.gcard .gi{height:78px;display:grid;place-items:center;font-size:32px;background:var(--side)}
.gcard .gb{padding:9px 12px;font-size:14px}
.meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mut)}
.big{font-size:54px;font-weight:700;line-height:1.1}
.chart{padding:8px 0}.chart text{fill:var(--fg);font-size:12px}
.toc{flex:1;padding:4px 0}.toc a{display:block;padding:2px 6px;border-radius:4px;color:var(--mut);cursor:pointer}.toc a:hover{background:var(--hover);color:var(--fg)}
.bm{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex:1;margin:3px 0}.bm a{color:var(--fg);text-decoration:none;flex:1;min-width:0}.bmu{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}.bm input{width:100%;border:0;outline:none;background:transparent}
.imgb{flex:1;margin:3px 0}.imgb img{max-width:100%;border-radius:6px;display:block}
.embed{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px 12px;margin:6px 0}
.embed .eh{font-weight:600;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.blk.synced .ed{background:rgba(235,87,87,.09);border-radius:4px}
.tg{cursor:pointer;color:var(--mut);user-select:none}
.multi{display:flex;gap:4px;flex-wrap:wrap;padding:4px;cursor:pointer;min-height:28px;min-width:90px;align-items:center}
.cc{display:block;padding:5px 6px;min-width:60px;font-size:14px}
.pc{cursor:pointer}.pc:hover{filter:brightness(.95)}
.aiout{white-space:pre-wrap;background:var(--side);border-radius:8px;padding:12px;margin-top:10px;max-height:300px;overflow:auto;font-size:14px}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rule{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:6px;margin-bottom:6px}
.sec2{font-weight:600;margin:16px 0 6px;font-size:14px}
.li{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;font-size:13px}
.tile.st{min-height:110px}
.nav .car.ic{font-size:14px}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;padding-bottom:8px}
.tlh{position:relative;height:26px;border-bottom:1px solid var(--line)}.tlh span{position:absolute;top:4px;font-size:11px;color:var(--mut);white-space:nowrap}
.tlr{position:relative;height:30px}.tlb{position:absolute;top:6px;height:18px;border-radius:5px;background:var(--accent);opacity:.85;cursor:pointer}.tlt{position:absolute;top:5px;font-size:13px;white-space:nowrap;cursor:pointer}
.tli{display:block;color:#fff;font-size:12px;line-height:18px;padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:sticky;left:0}
.tlnow{position:absolute;top:0;bottom:0;width:2px;background:#eb5757;opacity:.7;z-index:1}
.eqb{flex:1;padding:8px 10px;border-radius:6px;cursor:pointer;overflow:auto;text-align:center;font-size:1.15em}.eqb:hover{background:var(--hover)}.eqb.empty{color:var(--mut);text-align:left;font-size:15px}
</style>
</head>
<body>
<aside id="side"></aside>
<section id="main"></section>
<script>
(()=>{
'use strict';
const LS='notebook-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);attrs=attrs||{};for(const k in attrs){const v=attrs[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
function toast(m){const t=h('div',{class:'toast'},m);document.body.append(t);setTimeout(()=>t.remove(),2800)}

/* ---------- sanitize / normalize ---------- */
const ALLOWED=new Set(['b','strong','i','em','u','s','strike','code','a','br']);
function sanitize(html){const t=document.createElement('template');t.innerHTML=html||'';(function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}walk(c);const tag=c.tagName.toLowerCase();if(!ALLOWED.has(tag)){c.replaceWith(...c.childNodes);return}[...c.attributes].forEach(a=>{const k=a.name;if(tag==='a'&&(k==='data-page'||k==='class'||(k==='href'&&/^https?:/i.test(a.value))))return;c.removeAttribute(k)})})})(t.content);return t.innerHTML}
const VOID=new Set(['divider','toc','image','bookmark','button','dbview','equation']);
function normBlock(b){const o=Object.assign({},b);o.id=b.id||uid();o.type=b.type||'p';o.html=o.type==='code'?String(b.html||''):VOID.has(o.type)?'':sanitize(b.html);o.checked=!!b.checked;o.ind=+b.ind||0;if(o.src&&!/^data:image\//.test(o.src))o.src='';if(o.url&&!/^https?:/i.test(o.url))o.url='';if(o.tex!==undefined)o.tex=String(o.tex).slice(0,2000);return o}
function normDb(p){p.props=p.props||[];p.autos=p.autos||[];p.templates=p.templates||[];p.idn=p.idn||0;
  if(!p.views||!p.views.length)p.views=[{id:uid(),name:({board:'Board',list:'List'})[p.view]||'Table',type:p.view||'table',filters:[],sortBy:p.sortBy||'',desc:!!p.desc,groupBy:p.groupBy||null,q:p.filter||''}];
  p.views.forEach(v=>{v.filters=v.filters||[];v.hidden=v.hidden||[]});
  p.activeView=p.views.find(v=>v.id===p.activeView)?p.activeView:p.views[0].id;
  p.props.forEach(x=>{if(['select','multi','status'].includes(x.type))x.options=x.options||[]})}
function normalize(s){const o={pages:{},dark:!!s.dark,saved:s.saved||0,synced:s.synced||{},versions:s.versions||{},v:2};
  for(const id in(s.pages||{})){const p=s.pages[id];p.id=id;p.title=String(p.title||'');p.blocks=(p.blocks||[]).map(normBlock);p.created=p.created||Date.now();p.updated=p.updated||p.created;if(p.type==='db')normDb(p);if(p.type==='row')p.vals=p.vals||{};o.pages[id]=p}
  for(const k in o.synced)o.synced[k].html=sanitize(o.synced[k].html);return o}

/* ---------- state ---------- */
let S=null;
try{const r=localStorage.getItem(LS);if(r)S=normalize(JSON.parse(r))}catch(e){}
const ui={cur:'home',open:{},menu:null,page:null,blocksEl:null,sb:false,sample:null,cal:{}};
const P=id=>S.pages[id];
let saveT,cloud=null,cloudT,warned=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{S.saved=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){if(!warned){warned=true;toast('Browser storage is full. Export a backup and remove large images.')}}cloudSave()},300)}
function cloudSave(){if(!cloud)return;clearTimeout(cloudT);cloudT=setTimeout(()=>{try{cloud.set({json:JSON.stringify(S)})}catch(e){}},1500)}
async function initCloud(){try{if(!window.claude)return;const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;const id=await user.id();cloud=db.collection('data/users/'+id).doc('notebook');const snap=await cloud.get();const d=snap&&(typeof snap.data==='function'?snap.data():snap);if(d&&d.json){const c=normalize(JSON.parse(d.json));if((c.saved||0)>(S.saved||0)){S=c;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}}else cloudSave()}catch(e){}}

  list.forEach(({x,sp})=>sp.props.forEach(p=>{if(p.t!=='relation')return;const t=dbs[p.rel].x;const np={id:uid(),name:p.n,type:'relation',rel:t.id};if(p.back){const bp={id:uid(),name:p.back,type:'relation',rel:x.id,back:np.id};t.props.push(bp);np.back=bp.id}x.props.push(np)}));
  list.forEach(({x,sp})=>sp.props.forEach(p=>{if(p.t!=='rollup')return;const rp=x.props.find(q=>q.name===p.rel);const td=rp&&P(rp.rel);x.props.push({id:uid(),name:p.n,type:'rollup',relProp:rp&&rp.id,target:td&&p.target?pn(td,p.target):null,fn:p.fn||'count'})}));

    const vs=sp.views&&sp.views.length?sp.views:[{name:'Table',type:'table'}];vs.forEach(v=>{const nv=({id:uid(),name:v.name,type:v.type,filters:(v.filters||[]).map(f=>({prop:f.prop==='Name'?'__title':pn(x,f.prop),op:f.op,val:f.val})),hidden:[],sortBy:v.sortBy?(v.sortBy==='Name'?'__title':pn(x,v.sortBy)):'',desc:!!v.desc,groupBy:v.groupBy?pn(x,v.groupBy):null,dateProp:v.dateProp?pn(x,v.dateProp):null,endProp:v.endProp?pn(x,v.endProp):null,valueProp:v.valueProp?pn(x,v.valueProp):null,style:v.style||'bar'});nv.hidden=(v.hide||[]).map(n=>pn(x,n)).filter(Boolean);x.views.push(nv)});x.activeView=x.views[0].id});

    const t=inl(b.type==='sync'?(S.synced[b.sid]||{}).html:b.html),st=ind?` style="margin-left:${ind*24}px"`:'';
    switch(b.type){case'h1':return`<h2>${t}</h2>`;case'h2':return`<h3>${t}</h3>`;case'h3':return`<h4>${t}</h4>`;case'todo':return`<div class="ln"${st}>${b.checked?'☑':'☐'} ${t}</div>`;case'bullet':return`<div class="ln"${st}>• ${t}</div>`;case'num':return`<div class="ln"${st}>${n}. ${t}</div>`;case'toggle':return`<div class="ln"${st}><b>▸ ${t}</b></div>`;case'quote':return`<blockquote>${t}</blockquote>`;case'callout':return`<div class="co">💡 ${t}</div>`;case'code':return`<pre>${b.html}</pre>`;case'divider':return'<hr>';
      case'toc':return'<ul class="toc">'+p.blocks.filter(x=>['h1','h2','h3'].includes(x.type)).map(x=>`<li>${E(htmlToMd(x.html))}</li>`).join('')+'</ul>';
      case'image':return b.src?`<img src="${b.src}" alt="">`:'';
      case'bookmark':return b.url?`<p><a target="_blank" rel="noopener" href="${E(b.url)}">🔖 ${E(b.title||b.url)}</a></p>`:'';
      case'equation':{let m=null;try{m=mathHtml(b.tex||'')}catch(_){}return`<div class="eq">${m||'<code>'+E(b.tex||'')+'</code>'}</div>`}
      case'dbview':{const db=P(b.db);if(!db||db.trashed)return'';const v=db.views.find(x=>x.id===b.view)||db.views[0];return`<h3>${E(label(db))}</h3>`+tableHtml(db,rowsFor(db,v),v.hidden)}
      default:return t?`<p${st}>${t}</p>`:''}}).join('\n')};
  const nav=list.filter(x=>!x.row).map(x=>`<a href="#${x.p.id}" style="padding-left:${12+x.depth*14}px">${E(label(x.p))}</a>`).join('');
  const secs=list.map(({p,row})=>{let body='';if(p.type==='db')body=tableHtml(p,rowsOf(p),(activeView(p).hidden||[]));else{if(row&&P(p.parent))body='<dl>'+P(p.parent).props.map(pr=>`<dt>${E(pr.name)}</dt><dd>${E(disp(p,pr,P(p.parent)))||'&nbsp;'}</dd>`).join('')+'</dl>';body+=blocksHtml(p)}
    const up=row&&ids.has(p.parent)?`<p class="up"><a href="#${p.parent}">← ${E(P(p.parent).title||'Back')}</a></p>`:'';
    return`<section id="${p.id}" hidden>${p.cover?`<div class="cv" style="background:${p.cover}"></div>`:''}${up}<h1>${E((p.icon||'')+' '+(p.title||'Untitled'))}</h1>${body}</section>`}).join('\n');
  const css='*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:#37352f;background:#fff;display:flex;min-height:100vh}nav{width:250px;flex:none;background:#f7f7f5;border-right:1px solid #e9e9e7;padding:16px 6px;position:sticky;top:0;height:100vh;overflow:auto}nav b{display:block;padding:4px 12px 10px}nav a{display:block;padding:4px 12px;color:inherit;text-decoration:none;border-radius:6px;font-size:14px}nav a:hover,nav a.on{background:rgba(55,53,47,.08)}main{flex:1;min-width:0;padding:0 48px 80px;max-width:900px}.cv{height:140px;margin:0 -48px 10px}h1{font-size:2.2rem;line-height:1.2;margin:1.2em 0 .5em}h2{margin-top:1.4em}.ln{margin:2px 0}blockquote{border-left:3px solid #37352f;margin:.8em 0;padding-left:14px}.co{background:#f1f1ef;border-radius:6px;padding:10px 14px;margin:.6em 0}pre{background:#f1f1ef;padding:12px 14px;border-radius:6px;overflow:auto;font-size:13px}code{font-family:ui-monospace,monospace}img{max-width:100%;border-radius:6px}.tw{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #e9e9e7;padding:5px 9px;text-align:left}th{background:#f7f7f5}a{color:#2383e2}.up a,.toc{color:#777}dl{display:grid;grid-template-columns:160px 1fr;gap:2px 10px}dt{color:#999}dd{margin:0}.eq{margin:.6em 0;overflow:auto}@media(max-width:760px){body{display:block}nav{position:static;width:auto;height:auto}main{padding:0 18px 60px}.cv{margin:0 -18px 10px}}@media(prefers-color-scheme:dark){body{background:#191919;color:#e6e6e4}nav,th,pre,.co{background:#202020;border-color:#2f2f2f}td,th,nav{border-color:#2f2f2f}nav a:hover,nav a.on{background:rgba(255,255,255,.08)}blockquote{border-color:#e6e6e4}}';
  const js="function show(){var id=location.hash.slice(1)||'"+root.id+"',s=document.getElementById(id)||document.getElementById('"+root.id+"');document.querySelectorAll('section').forEach(function(x){x.hidden=x!==s});document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+s.id)});var h=s.querySelector('h1');document.title=h?h.textContent:'Notes';window.scrollTo(0,0)}addEventListener('hashchange',show);show();";
  return`<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${E(root.title||'Notes')}</title><style>${css}</style></head><body><nav><b>${E(label(root))}</b>${nav}</nav><main>\n${secs}\n</main><script>${js}<\/script></body></html>`}
async function siteDlg(p){
  const hasEq=[p,...descendants(p.id).map(P)].some(x=>x&&x.blocks&&x.blocks.some(b=>b.type==='equation'));if(hasEq)try{await loadKatex()}catch(_){}
  const html=siteHtml(p);const n=(html.match(/<section /g)||[]).length;
  modal('🌐 Export as website',(d,close)=>{const ta=h('textarea',{readonly:true,style:'min-height:120px'});ta.value=html;const kb=Math.round(html.length/1024);
    d.append(h('p',{style:'margin:0 0 6px'},n+' page'+(n===1?'':'s')+' · '+kb+' KB · one self-contained HTML file with navigation, no server needed.'),h('div',{style:'color:var(--mut);font-size:13px;margin-bottom:6px'},'Save it as index.html in a GitHub repository with Pages turned on (or any static host) to publish this page and everything under it. Databases export as tables and linked pages keep working. Check the contents first: everything in the selected page tree, including database rows, is included.'),ta,
      h('div',{class:'row'},h('button',{class:'btn bd',onclick:close},'Close'),h('button',{class:'btn bd',onclick:()=>{try{const a=h('a',{href:URL.createObjectURL(new Blob([html],{type:'text/html'})),download:((p.title||'site').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'site')+'.html'});document.body.append(a);a.click();a.remove()}catch(e){}toast('If nothing downloaded, use Copy instead')}},'Download .html'),h('button',{class:'btn pri',onclick:async e=>{e.target.textContent=(await copyText(html))?'Copied!':'Select all and copy'}},'Copy HTML')))})}

/* ---------- import .md / .csv files ---------- */
function csvToDb(name,text){const rows=parseCsv(text);if(!rows.length)return null;const hd=rows[0].map(x=>x.trim()),data=rows.slice(1);let ti=hd.findIndex(x=>/^(name|title)$/i.test(x));if(ti<0)ti=0;
  const db=newPage(null,'db',false);db.title=name;db.icon='🗂️';db.props=[];db.views=[{id:uid(),name:'Table',type:'table',filters:[],hidden:[],sortBy:'',desc:false}];db.activeView=db.views[0].id;
  const cols=hd.map((n,i)=>{if(i===ti)return null;const vals=data.map(r=>(r[i]||'').trim()).filter(Boolean);let ty='text';if(vals.length){if(vals.every(v=>!isNaN(+v)))ty='number';else if(vals.every(v=>/^\d{4}-\d\d-\d\d/.test(v)))ty='date';else if(vals.every(v=>/^(true|false)$/i.test(v)))ty='checkbox'}const pr={id:uid(),name:n||'Column '+(i+1),type:ty};db.props.push(pr);return pr});
  data.forEach(rw=>{const r=newPageObj(db.id,'row');r.vals={};r.title=(rw[ti]||'').trim();cols.forEach((pr,i)=>{if(!pr)return;const x=(rw[i]||'').trim();if(x==='')return;r.vals[pr.id]=pr.type==='number'?+x:pr.type==='checkbox'?/^true$/i.test(x):pr.type==='date'?x.slice(0,10):x});S.pages[r.id]=r});save();return db}
function filesDlg(){modal('Import files',(d,close)=>{const msg=h('div',{style:'margin-top:8px;font-size:13px'});const inp=h('input',{type:'file',multiple:true,accept:'.md,.markdown,.txt,.csv'});
  inp.addEventListener('change',async()=>{let np=0,nd=0;for(const f of inp.files){try{const t=await f.text(),base=f.name.replace(/\.[^.]+$/,'').replace(/\s[0-9a-f]{32}$/i,'');
      if(/\.csv$/i.test(f.name)){if(csvToDb(base,t))nd++}else{const p=newPage(null,'page',false);const m=t.match(/^# (.*)\n/);p.title=m?m[1]:base;p.blocks=mdToBlocks(m?t.slice(m[0].length):t);touch(p);np++}}catch(e){}}
    msg.textContent='Imported '+np+' page'+(np===1?'':'s')+' and '+nd+' database'+(nd===1?'':'s')+'.';render()});
  d.append(h('div',{style:'color:var(--mut);font-size:13px;margin-bottom:8px'},'Choose Markdown (.md) files to create pages and CSV files to create databases. This works with Notion exports (unzip them first), Jira or spreadsheet CSV exports, and notes from most other apps. Relations between exported databases are not preserved.'),inp,msg,h('div',{class:'row'},h('button',{class:'btn pri',onclick:close},'Done')))})}

  w.blocks=mkBlocks([['h1','Your private workspace'],['p','Everything is saved in this browser. Use <b>Data</b> in the sidebar to export a backup.'],['toc'],['h2','Try these'],['todo','Type <code>/</code> on an empty line to see every block type'],['todo','Press <code>Tab</code> to indent a block, and nest items under a toggle'],['todo','Type <code>[[</code> to link to another page, then check Backlinks at the bottom'],['todo','Open <b>IT Operations Hub</b> in the sidebar and explore the linked databases'],['todo','Switch a database between table, board, calendar, gallery and chart views'],['callout','Databases support relations, rollups, formulas, filters, templates and automations. Add a <b>Linked database</b> block to build your own dashboards.'],['quote','Make something you will actually use.'],['divider'],['code','console.log("hello, notebook")'],['p']]);

(function boot(){
  if(!S){S={pages:{},dark:!!(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches),saved:0,synced:{},versions:{},v:2};const w=welcome();S.pages[w.id]=w;const hub=installStarter(IT_HUB);w.created=hub.created-1;ui.cur=w.id}
